<app-dialog-shell [heading]="data.title">
  <p class="message">{{ data.message }}</p>
  <!-- Cancel comes first, so it gets the initial focus: Enter alone never confirms. -->
  <ng-container dialog-actions>
    <button matButton type="button" (click)="dialogRef.close(false)">Cancel</button>
    <button matButton="filled" type="button" (click)="dialogRef.close(true)">
      {{ data.confirmLabel }}
    </button>
  </ng-container>
</app-dialog-shell>
