<div class="table-wrapper">
  <table
    mat-table
    [dataSource]="customers()"
    matSort
    matSortDisableClear
    [matSortActive]="sort().field"
    [matSortDirection]="sort().order"
    (matSortChange)="onSortChange($event)"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let customer">{{ customer.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let customer">{{ customer.email }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let customer">
        <span class="status status--{{ customer.status }}">{{ customer.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
      <td mat-cell *matCellDef="let customer">{{ customer.createdAt | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
      <td mat-cell *matCellDef="let customer" class="actions-cell">
        <button
          matIconButton
          type="button"
          [attr.aria-label]="'Edit ' + customer.name"
          (click)="edit.emit(customer)"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let customer; columns: columns"></tr>
  </table>
</div>
