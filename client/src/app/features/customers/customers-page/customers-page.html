<app-customer-toolbar
  [query]="store.query()"
  [sort]="store.sort()"
  [view]="activeView()"
  [showViewSwitch]="!isMobile()"
  [busy]="busy()"
  (queryChange)="store.setQuery($event)"
  (clear)="store.clearQuery()"
  (sortChange)="store.setSort($event)"
  (viewChange)="onViewChange($event)"
  (add)="openAdd()"
  (reset)="confirmReset()"
/>

<!-- Always in the page, so screen readers announce each new count. Hidden on screen when the
     list is empty, because the empty state already says so. -->
<p class="result-count" aria-live="polite" [class.visually-hidden]="store.isEmpty()">
  {{ resultCountLabel() }}
</p>

@if (store.initialLoad()) {
  <app-loading-state label="Loading customers…" />
} @else if (store.error() && store.isEmpty()) {
  <app-error-state
    heading="Couldn't load customers"
    [message]="store.error()!.message"
    (retry)="store.reload()"
  />
} @else if (store.isEmpty() && store.hasQuery()) {
  <app-empty-state
    icon="search_off"
    heading="No customers match “{{ store.query().trim() }}”"
    message="Check the spelling, or search by email."
    actionLabel="Clear search"
    (action)="store.clearQuery()"
  />
} @else if (store.isEmpty()) {
  <app-empty-state
    icon="group"
    heading="No customers yet"
    message="Add your first customer, or restore the demo data from the ⋮ menu."
    actionLabel="Add customer"
    (action)="openAdd()"
  />
} @else {
  <!-- The list is still there, so a failed refresh gets a banner instead of replacing it. -->
  @if (store.error(); as error) {
    <app-error-banner [message]="error.message">
      <button matButton type="button" (click)="store.reload()">Try again</button>
      <button matIconButton type="button" aria-label="Dismiss error" (click)="store.dismissError()">
        <mat-icon>close</mat-icon>
      </button>
    </app-error-banner>
  }

  @switch (activeView()) {
    @case ('table') {
      <app-customer-table
        [customers]="store.customers()"
        [sort]="store.sort()"
        (sortChange)="store.setSort($event)"
        (edit)="openEdit($event)"
      />
    }
    @case ('cards') {
      <app-customer-cards [customers]="store.customers()" (edit)="openEdit($event)" />
    }
  }

  <!-- One paginator for both views. It counts pages from 0, the API from 1. -->
  <mat-paginator
    [length]="store.total()"
    [pageIndex]="store.page() - 1"
    [pageSize]="store.pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Choose a page of customers"
    (page)="store.setPage($event.pageIndex + 1, $event.pageSize)"
  />
}
