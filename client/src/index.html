<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Customers</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      /* Startup placeholder: plain CSS, because Angular isn't running yet. */
      .startup-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding-top: 160px;
        color: var(--mat-sys-on-surface-variant, #44474e);
      }

      .startup-spinner {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        border: 4px solid var(--mat-sys-surface-container-highest, #e0e2ec);
        border-top-color: var(--mat-sys-primary, #005cbb);
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Slower for people who ask the system for less motion. */
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <!-- The app waits for the first customer list before it renders (see app.config.ts).
         Until then the browser shows this; Angular replaces it when the app renders. -->
    <app-root>
      <div class="startup-loading" role="status">
        <span class="startup-spinner" aria-hidden="true"></span>
        <p>Loading customers…</p>
      </div>
    </app-root>
  </body>
</html>
